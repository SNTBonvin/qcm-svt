<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Mise en page : en-tête, bandeau de 4 étapes, puis un plan de travail par étape avec zones de dépôt et chromosomes-jetons. */
:root{
  --bg:#f2f6f9; --surface:#ffffff; --surface2:#e6edf3; --ink:#14232e; --muted:#4d6170; --line:#c4d1db;

  --good:#14623a; --goodbg:#dff3e6; --bad:#9c1f19; --badbg:#fbe4e2;
  --c-A:#d8343f; --c-B:#b52a9a; --c-O:#ee9fc4; --c-n:#ecd21f; --c-p:#f09a1f; --chr-edge:rgba(20,35,46,.55);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1820; --surface:#16252f; --surface2:#1d3140; --ink:#e8eff4; --muted:#9db0bd; --line:#34495a;
  --accent:#6aa3ff; --accent-ink:#0b1722; --drop:#21405f; --good:#7fdba6; --goodbg:#173a2a; --bad:#ffa39b; --badbg:#442120;
  --chr-edge:rgba(255,255,255,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1820; --surface:#16252f; --surface2:#1d3140; --ink:#e8eff4; --muted:#9db0bd; --line:#34495a;
  --accent:#6aa3ff; --accent-ink:#0b1722; --drop:#21405f; --good:#7fdba6; --goodbg:#173a2a; --bad:#ffa39b; --badbg:#442120;
  --chr-edge:rgba(255,255,255,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}

h2{font-size:1.35rem;font-weight:800}

p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

header{display:flex;flex-direction:column;gap:8px}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.stepbtn{flex:1 0 auto;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;white-space:nowrap}
.stepbtn .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);font-size:.85rem}
.stepbtn.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepbtn.cur .n{background:rgba(255,255,255,.25);color:inherit}

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tok{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px}
.tok.sel{outline:3px solid var(--accent);outline-offset:2px}
.tok.dragging{opacity:.35}
.chipTok{border:1px solid var(--line);background:var(--surface);padding:9px 10px;font-weight:700;text-align:center}
.chrTok{border:1px solid var(--line);background:var(--surface);padding:8px 10px;display:flex;align-items:flex-end}
.gamTok{border:1px solid var(--line);background:var(--surface);padding:4px 6px;display:inline-flex}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--accent);
  border-radius:8px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.zone{border:2px dashed var(--line);border-radius:10px;background:var(--surface);cursor:pointer;display:grid;place-items:center}
.zone.over{background:var(--drop);border-color:var(--accent)}
.ph{color:var(--muted);font-size:.78rem;text-align:center;padding:2px}
.frame{min-height:84px;font-family:var(--f-display);font-size:1.5rem;font-weight:800}
.frame .ph{font-family:var(--f-body);font-weight:400}
.slot{width:44px}
.slot.k9{height:60px}.slot.k1{height:78px}
.slot.sm{width:27px;border-radius:6px}.slot.sm.k9{height:42px}.slot.sm.k1{height:54px}
.slot.sm .ph{font-size:.62rem}
.chr{display:block;width:24px;height:auto}.chr.sm{width:17px}
.mini{display:flex;gap:2px;align-items:flex-end}
.palette{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.palgroup{display:flex;flex-direction:column;gap:6px}
.palgroup .row{display:flex;gap:8px;align-items:flex-end}
.pairs{display:flex;gap:28px;flex-wrap:wrap}
.pair{display:flex;flex-direction:column;gap:6px;align-items:center}
.pair .slots{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.pair .slots .zone{background:var(--surface)}
.pl{font-size:.85rem;color:var(--muted);font-weight:700}
.gametes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.gam{display:flex;flex-direction:column;gap:6px;align-items:center}
.gcirc{width:124px;height:124px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);display:flex;gap:8px;align-items:flex-end;justify-content:center;padding-bottom:20px;padding-top:14px}
.gam .gl{font-size:.85rem;font-weight:700;color:var(--muted)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{padding:10px 14px;border-radius:8px;background:var(--surface2);max-width:80ch}
.msg.ok{background:var(--goodbg);color:var(--good)}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg:empty{display:none}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.person .pairs{gap:14px}
.person .slots{padding:6px 8px;display:flex;gap:6px;align-items:flex-end;background:var(--surface2);border-radius:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.pun{border-collapse:collapse;min-width:100%}
.pun th,.pun td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:middle;background:var(--surface)}
.pun th.corner{font-size:.8rem;color:var(--muted);min-width:96px;background:var(--surface2)}
.pun th{background:var(--surface2)}
.hslots{display:flex;gap:4px;justify-content:center;align-items:flex-end}
.cell{display:flex;gap:4px;justify-content:center}
.half{min-width:48px;min-height:58px;padding:2px 3px;border-radius:6px;align-items:end;display:grid;place-items:center}
.pun td{min-width:110px}
.pun td.ok{background:var(--goodbg)}
.pun td.ko{background:var(--badbg)}
.pheno{font-size:.8rem;font-weight:700;margin-top:4px;min-height:1.2em}
.phase{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bars{display:grid;gap:6px;max-width:520px}
.bar{display:grid;grid-template-columns:64px 1fr 40px;gap:10px;align-items:center;font-size:.9rem}
.bar .track{background:var(--surface2);border-radius:6px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar b{font-variant-numeric:tabular-nums}
.q{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.opts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opt{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt.ok{background:var(--goodbg);color:var(--good);border-color:var(--good)}
.opt.ko{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{font:inherit;width:90px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.keep{display:flex;flex-direction:column;gap:6px;padding-left:1.2em;margin:0;max-width:70ch}
.hand{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hand[hidden]{display:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
footer{display:flex;flex-direction:column;gap:10px;margin-top:8px}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">SVT · Classe de 3ème · Génétique</span>
    <h1>Brassage génétique</h1>
    <p class="lede">Deux frères ou sœurs ont les mêmes parents et pourtant ils ne sont pas identiques. Construis ta carte génétique, forme des gamètes, puis simule une fécondation pour comprendre pourquoi.</p>
  </header>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>
<div id="hand" class="hand" hidden></div>

<script>
(function(){
'use strict';
var L={A:'A',B:'B',O:'O',p:'+',n:'−'};
var CHR={A:9,B:9,O:9,p:1,n:1};
var GROUPS=[['A','+'],['AB','-'],['B','+'],['AB','+'],['O','-'],['A','-'],['O','+'],['B','-']];
var MOTH={g9:['A','O'],g1:['p','n']}, FATH={g9:['B','O'],g1:['p','n']};
var rhs=function(r){return r==='+'?'+':'−';};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');};
var uniq=function(a){return a.filter(function(x,i){return a.indexOf(x)===i;});};

function init(){
  return {step:1,me:null,
    s1:{grp:null,p9:[null,null],p1:[null,null],done:false,msg:null},
    s2:{g:[0,1,2,3].map(function(){return {c9:null,c1:null};}),done:false,msg:null},
    s3:{fh:[0,1,2,3].map(function(){return {c9:null,c1:null};}),mh:[0,1,2,3].map(function(){return {c9:null,c1:null};}),
      hdrDone:false,done:false,msg:null,
      cells:[0,1,2,3].map(function(){return [0,1,2,3].map(function(){return {f:null,m:null};});}),
      cs:[0,1,2,3].map(function(){return [null,null,null,null];})},
    s4:{a:{},done:false}};
}
var S=init(), selK=null;

/* ---------- dessin ---------- */
function chrSVG(al,cls){
  var k=CHR[al], h=k===9?44:62, cen=k===9?19:26;
  return '<svg class="chr '+(cls||'')+'" viewBox="0 0 24 '+h+'" role="img" aria-label="chromosome n°'+k+', allèle '+L[al]+'">'+
  '<g fill="var(--c-'+al+')" stroke="var(--chr-edge)" stroke-width="1.2"><rect x="8" y="'+(cen-3)+'" width="8" height="8" stroke="none"/>'+
  '<rect x="3" y="1" width="18" height="'+(cen-1)+'" rx="8"/><rect x="3" y="'+(cen+3)+'" width="18" height="'+(h-cen-4)+'" rx="8"/></g>'+
  '<rect x="5" y="6" width="14" height="13" rx="2" fill="#101820"/>'+
  '<text x="12" y="16.3" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">'+L[al]+'</text></svg>';
}
function gamHTML(g,cls){return '<span class="mini">'+chrSVG(g.c9,cls)+chrSVG(g.c1,cls)+'</span>';}
var key=function(p){return JSON.stringify(p);};
function tok(p,inner,cls){
  var on=selK===key(p);
  return '<div class="tok '+(cls||'')+(on?' sel':'')+'" data-p="'+esc(key(p))+'" tabindex="0" role="button" aria-pressed="'+on+'">'+inner+'</div>';
}
function zone(id,inner,cls,label){
  return '<div class="zone '+cls+'" data-z="'+id+'" tabindex="0" role="button" aria-label="'+esc(label)+'">'+inner+'</div>';
}
function slot(id,chr,al,sm){
  return zone(id, al?chrSVG(al,sm?'sm':''):'<span class="ph">n°'+chr+'</span>', 'slot k'+chr+(sm?' sm':''),
    'Emplacement chromosome n°'+chr+(al?', contient '+L[al]+' (toucher pour vider)':', vide'));
}
function roSlots(g9,g1){
  return '<div class="pair"><div class="slots">'+g9.map(function(a){return chrSVG(a);}).join('')+'</div><span class="pl">paire n°9</span></div>'+
         '<div class="pair"><div class="slots">'+g1.map(function(a){return chrSVG(a);}).join('')+'</div><span class="pl">paire n°1</span></div>';
}
function palette(){
  return '<div class="palette"><div class="palgroup"><span class="pl">Chromosomes n°9</span><div class="row">'+
    ['A','B','O'].map(function(a){return tok({t:'chr',chr:9,al:a},chrSVG(a),'chrTok');}).join('')+'</div></div>'+
    '<div class="palgroup"><span class="pl">Chromosomes n°1</span><div class="row">'+
    ['n','p'].map(function(a){return tok({t:'chr',chr:1,al:a},chrSVG(a),'chrTok');}).join('')+'</div></div></div>';
}
function msgBox(m){return '<div class="msg '+(m?(m.ok?'ok':'bad'):'')+'" role="status">'+(m?m.text:'')+'</div>';}

/* ---------- caractères observés ---------- */
function phen9(p){var a=p.indexOf('A')>=0,b=p.indexOf('B')>=0;return a&&b?'AB':a?'A':b?'B':'O';}
function phen1(p){return p.indexOf('p')>=0?'+':'-';}
function pheLabel(p9,p1){return phen9(p9)+' rh'+rhs(phen1(p1));}

/* ---------- étape 1 ---------- */
function r1(){
  var s=S.s1;
  var chips=GROUPS.map(function(g){return tok({t:'grp',g:g[0]+g[1]},g[0]+' rh'+rhs(g[1]),'chipTok');}).join('');
  var frame=zone('s1:grp', s.grp?(s.grp.slice(0,-1)+' rh'+rhs(s.grp.slice(-1))):'<span class="ph">Glisse ton groupe ici</span>','frame','Cadre du groupe sanguin');
  return '<div class="card"><div class="mission"><b class="t">Ta mission</b>'+
    '<p>Fabrique ta carte génétique. D’abord, choisis un groupe sanguin et un rhésus. Ensuite, place les chromosomes dans les paires n°9 (groupe sanguin) et n°1 (rhésus) pour que ta carte donne bien ce groupe.</p>'+
    '<p>Glisse chaque élément avec la souris ou le doigt. Tu peux aussi le toucher, puis toucher l’emplacement. Toucher un emplacement rempli le vide.</p></div>'+
    '<details><summary>Coup de pouce</summary><p>Une paire contient deux chromosomes, un reçu de chaque parent. Sur la paire n°9, le gène du groupe sanguin existe en trois versions (allèles) : A, B et O. A et B s’expriment tous les deux. O ne s’exprime que s’il est présent en double. Sur la paire n°1, le gène du rhésus existe en deux allèles : + et −. L’allèle + s’exprime dès qu’il est présent.</p></details>'+
    '<div class="grid2"><div class="card"><h3>1. Mon groupe sanguin et mon rhésus</h3><div class="chips">'+chips+'</div>'+frame+'</div>'+
    '<div class="card"><h3>2. Ma carte génétique</h3><div class="pairs">'+
      '<div class="pair"><div class="slots">'+slot('s1:p9:0',9,s.p9[0])+slot('s1:p9:1',9,s.p9[1])+'</div><span class="pl">paire n°9</span></div>'+
      '<div class="pair"><div class="slots">'+slot('s1:p1:0',1,s.p1[0])+slot('s1:p1:1',1,s.p1[1])+'</div><span class="pl">paire n°1</span></div></div>'+
      '<h3>Matériel génétique à disposition</h3>'+palette()+'</div></div>'+
    msgBox(s.msg)+
    '<div class="btns">'+(s.done?'<button class="btn" data-act="next">Étape 2 : mes gamètes →</button>':'<button class="btn" data-act="check1">Vérifier ma carte</button>')+'</div></div>';
}
function check1(){
  var s=S.s1;
  if(!s.grp){s.msg={ok:false,text:'Choisis d’abord ton groupe sanguin et ton rhésus, et glisse-le dans le cadre.'};return;}
  if(s.p9.indexOf(null)>=0||s.p1.indexOf(null)>=0){s.msg={ok:false,text:'Il manque des chromosomes : chaque paire en contient deux.'};return;}
  var lt=s.grp.slice(0,-1), r=s.grp.slice(-1), a9=phen9(s.p9), a1=phen1(s.p1), errs=[];
  if(a9!==lt){
    var h={O:'Pour être de groupe O, il faut deux allèles O.',AB:'Pour être de groupe AB, il faut un allèle A et un allèle B.',
           A:'Pour être de groupe A, il faut au moins un allèle A et aucun allèle B.',B:'Pour être de groupe B, il faut au moins un allèle B et aucun allèle A.'}[lt];
    errs.push('Avec les allèles '+s.p9.map(function(x){return L[x];}).join(' et ')+' sur la paire n°9, tu serais de groupe '+a9+', pas '+lt+'. '+h);
  }
  if(a1!==r){
    errs.push('Avec les allèles '+s.p1.map(function(x){return L[x];}).join(' et ')+' sur la paire n°1, tu serais rhésus '+rhs(a1)+', pas '+rhs(r)+'. '+
      (r==='-'?'Pour être rhésus −, il faut deux allèles −.':'Pour être rhésus +, il faut au moins un allèle +.'));
  }
  if(errs.length){s.msg={ok:false,text:errs.join(' ')};return;}
  S.me={g9:s.p9.slice(),g1:s.p1.slice()};
  var d9=s.p9[0]===s.p9[1]?'deux allèles identiques sur la paire n°9':'deux allèles différents sur la paire n°9';
  var d1=s.p1[0]===s.p1[1]?'deux allèles identiques sur la paire n°1':'deux allèles différents sur la paire n°1';
  s.done=true;
  s.msg={ok:true,text:'Bravo, ta carte est correcte. Tu as '+d9+' et '+d1+'. Plusieurs cartes étaient possibles pour un même groupe : on peut voir le groupe sanguin sans savoir quels allèles se cachent derrière.'};
}
function d1(a,p){
  var s=S.s1; if(s.done)return;
  if(a[1]==='grp'){
    if(!p){s.grp=null;s.p9=[null,null];s.p1=[null,null];s.msg=null;return;}
    if(p.t!=='grp'){s.msg={ok:false,text:'Dans ce cadre, on place un groupe sanguin et un rhésus.'};return;}
    s.grp=p.g;s.p9=[null,null];s.p1=[null,null];s.msg=null;return;
  }
  var chr=a[1]==='p9'?9:1, i=+a[2], arr=chr===9?s.p9:s.p1;
  if(!p){arr[i]=null;s.msg=null;return;}
  if(p.t!=='chr'){s.msg={ok:false,text:'Ici, il faut placer un chromosome.'};return;}
  if(p.chr!==chr){s.msg={ok:false,text:'Ce chromosome appartient à la paire n°'+p.chr+'. Cet emplacement est dans la paire n°'+chr+'.'};shake(a.join(':'));return;}
  arr[i]=p.al;s.msg=null;
}

/* ---------- vérification de gamètes (étapes 2 et 3) ---------- */
function checkGametes(list,g9,g1,who,pron){
  var part=-1;
  list.forEach(function(g,i){if(part<0&&(g.c9||g.c1)&&!(g.c9&&g.c1))part=i;});
  if(part>=0)return {ok:false,text:'Le gamète '+(part+1)+' est incomplet : un gamète reçoit un chromosome n°9 et un chromosome n°1.'};
  var done=list.map(function(g,i){return {g:g,i:i};}).filter(function(x){return x.g.c9&&x.g.c1;});
  if(!done.length)return {ok:false,text:'Place des chromosomes dans les gamètes.'};
  for(var k=0;k<done.length;k++){
    var g=done[k].g, n=done[k].i+1;
    if(g9.indexOf(g.c9)<0)return {ok:false,text:'Le gamète '+n+' contient l’allèle '+L[g.c9]+' sur le chromosome n°9, mais '+who+' '+pron+' cet allèle. Un gamète ne reçoit que des chromosomes de la personne qui le fabrique.'};
    if(g1.indexOf(g.c1)<0)return {ok:false,text:'Le gamète '+n+' contient l’allèle '+L[g.c1]+' sur le chromosome n°1, mais '+who+' '+pron+' cet allèle.'};
  }
  for(var x=0;x<done.length;x++)for(var y=x+1;y<done.length;y++){
    if(done[x].g.c9===done[y].g.c9&&done[x].g.c1===done[y].g.c1)
      return {ok:false,text:'Les gamètes '+(done[x].i+1)+' et '+(done[y].i+1)+' sont identiques. On cherche tous les gamètes différents.'};
  }
  var total=uniq(g9).length*uniq(g1).length;
  if(done.length<total)return {ok:false,text:'Ces gamètes sont possibles, mais il en existe d’autres. Essaie d’associer autrement les chromosomes n°9 et n°1.'};
  return {ok:true,n:total};
}

/* ---------- étape 2 ---------- */
function r2(){
  var s=S.s2;
  if(!S.s1.done)return '<div class="card"><p>Termine d’abord l’étape 1.</p></div>';
  var circles=s.g.map(function(g,i){
    return '<div class="gam"><div class="gcirc">'+slot('s2:g:'+i+':9',9,g.c9)+slot('s2:g:'+i+':1',1,g.c1)+'</div><span class="gl">Gamète '+(i+1)+'</span></div>';
  }).join('');
  return '<div class="card"><div class="mission"><b class="t">Ta mission</b>'+
    '<p>Un gamète (cellule reproductrice) ne reçoit qu’un seul chromosome de chaque paire : un chromosome n°9 et un chromosome n°1. Fabrique tous les gamètes différents que tu peux produire. Remplis seulement les cercles dont tu as besoin.</p></div>'+
    '<div class="grid2"><div class="card"><h3>Ma carte génétique</h3><div class="pairs">'+roSlots(S.me.g9,S.me.g1)+'</div>'+
    '<h3>Matériel génétique à disposition</h3>'+palette()+'</div>'+
    '<div class="card"><h3>Gamètes que je suis capable de produire</h3><div class="gametes">'+circles+'</div></div></div>'+
    msgBox(s.msg)+
    '<div class="btns">'+(s.done?'<button class="btn" data-act="next">Étape 3 : la fécondation →</button>':'<button class="btn" data-act="check2">Vérifier mes gamètes</button>')+'</div></div>';
}
function check2(){
  var s=S.s2, r=checkGametes(s.g,S.me.g9,S.me.g1,'tu','ne possèdes pas');
  if(!r.ok){s.msg={ok:false,text:r.text};return;}
  var het=(S.me.g9[0]!==S.me.g9[1]?1:0)+(S.me.g1[0]!==S.me.g1[1]?1:0);
  var t;
  if(het===0)t='Bravo ! Tes deux paires ont deux allèles identiques : tous tes gamètes sont identiques.';
  else if(het===1)t='Bravo ! Une de tes paires a deux allèles différents : tu produis 2 sortes de gamètes. Les chromosomes d’une paire se séparent au hasard.';
  else t='Bravo ! Tes deux paires ont des allèles différents. Chaque paire se sépare au hasard, indépendamment de l’autre : 2 × 2 = 4 sortes de gamètes. C’est le brassage génétique.';
  s.done=true;s.msg={ok:true,text:t};
}
function d2(a,p){
  var s=S.s2; if(s.done)return;
  var i=+a[2],chr=+a[3],g=s.g[i],f=chr===9?'c9':'c1';
  if(!p){g[f]=null;s.msg=null;return;}
  if(p.t!=='chr'){s.msg={ok:false,text:'Ici, il faut placer un chromosome.'};return;}
  if(p.chr!==chr){s.msg={ok:false,text:'Cet emplacement reçoit un chromosome n°'+chr+', or tu as choisi un chromosome n°'+p.chr+'.'};shake(a.join(':'));return;}
  g[f]=p.al;s.msg=null;
}

/* ---------- étape 3 ---------- */
function r3(){
  var s=S.s3;
  if(!S.s2.done)return '<div class="card"><p>Termine d’abord l’étape 2.</p></div>';
  var hdr=function(sex,i){
    var g=(sex==='f'?s.fh:s.mh)[i];
    if(s.hdrDone)return tok({t:'gam',sex:sex,c9:g.c9,c1:g.c1},gamHTML(g,'sm'),'gamTok');
    return '<div class="hslots">'+slot('s3:h:'+sex+':'+i+':9',9,g.c9,true)+slot('s3:h:'+sex+':'+i+':1',1,g.c1,true)+'</div>';
  };
  var cols=[0,1,2,3].map(function(j){return '<th scope="col" aria-label="Gamète mâle '+(j+1)+'">'+hdr('m',j)+'</th>';}).join('');
  var rows=[0,1,2,3].map(function(i){
    var tds=[0,1,2,3].map(function(j){
      var c=s.cells[i][j], st=s.cs[i][j];
      var half=function(sex){
        return zone('s3:c:'+i+':'+j+':'+sex, c[sex]?gamHTML(c[sex],'sm'):'<span class="ph">'+(sex==='f'?'♀':'♂')+'</span>','half',
          (sex==='f'?'Gamète femelle':'Gamète mâle')+', ligne '+(i+1)+', colonne '+(j+1)+(c[sex]?' (rempli)':' (vide)'));
      };
      var ph=(st==='ok'&&c.f&&c.m)?pheLabel([c.f.c9,c.m.c9],[c.f.c1,c.m.c1]):'';
      return '<td class="'+(st||'')+'"><div class="cell">'+half('f')+half('m')+'</div><div class="pheno">'+ph+'</div></td>';
    }).join('');
    return '<tr><th scope="row" aria-label="Gamète femelle '+(i+1)+'">'+hdr('f',i)+'</th>'+tds+'</tr>';
  }).join('');
  var table='<div class="tablewrap"><table class="pun"><thead><tr><th class="corner">♀ à gauche<br>♂ en haut</th>'+cols+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
  var btns;
  if(s.done)btns='<button class="btn" data-act="next">Étape 4 : faire le bilan →</button>';
  else if(!s.hdrDone)btns='<button class="btn" data-act="check3a">Vérifier les gamètes des parents</button>';
  else btns='<button class="btn" data-act="check3b">Vérifier le tableau</button><button class="btn ghost" data-act="ex3">Voir un exemple</button><button class="btn ghost" data-act="clear3">Effacer le tableau</button>';
  var phase=s.hdrDone?'Partie B · Les enfants possibles':'Partie A · Les gamètes des parents';
  return '<div class="card"><div class="mission"><b class="t">Ta mission</b>'+
    '<p>Camille et Noa attendent un enfant. Camille est de groupe A rhésus +, Noa est de groupe B rhésus +. Quels enfants peuvent naître ?</p>'+
    '<p><b>Partie A.</b> Complète les gamètes que chaque parent peut produire (en-têtes du tableau), puis vérifie. <b>Partie B.</b> Glisse chaque gamète dans les cases : la fécondation réunit un gamète de Camille (♀) et un gamète de Noa (♂).</p></div>'+
    '<div class="people"><div class="person"><h3>Camille ♀ · A rh+</h3><div class="pairs">'+roSlots(MOTH.g9,MOTH.g1)+'</div><p class="ph" style="text-align:left">Elle a reçu A et + de son père, O et − de sa mère.</p></div>'+
    '<div class="person"><h3>Noa ♂ · B rh+</h3><div class="pairs">'+roSlots(FATH.g9,FATH.g1)+'</div><p class="ph" style="text-align:left">Il a reçu B et − de son père, O et + de sa mère.</p></div></div>'+
    (s.hdrDone?'':'<div class="card"><h3>Matériel génétique à disposition</h3>'+palette()+'</div>')+
    '<span class="phase">'+phase+'</span>'+table+
    '<p class="ph" style="text-align:left">Dans chaque case : le gamète de Camille (♀) à gauche, celui de Noa (♂) à droite.</p>'+
    msgBox(s.msg)+'<div class="btns">'+btns+'</div></div>';
}
function d3(a,p){
  var s=S.s3;
  if(a[1]==='h'){
    if(s.hdrDone)return;
    var sex=a[2],i=+a[3],chr=+a[4],g=(sex==='f'?s.fh:s.mh)[i],f=chr===9?'c9':'c1';
    if(!p){g[f]=null;s.msg=null;return;}
    if(p.t!=='chr'){s.msg={ok:false,text:'Ici, il faut placer un chromosome.'};return;}
    if(p.chr!==chr){s.msg={ok:false,text:'Cet emplacement reçoit un chromosome n°'+chr+', or tu as choisi un chromosome n°'+p.chr+'.'};shake(a.join(':'));return;}
    g[f]=p.al;s.msg=null;return;
  }
  if(!s.hdrDone){s.msg={ok:false,text:'Commence par compléter et vérifier les gamètes des deux parents, dans les en-têtes du tableau.'};return;}
  if(s.done)return;
  var ii=+a[2],jj=+a[3],sx=a[4],c=s.cells[ii][jj];
  if(!p){c[sx]=null;s.cs[ii][jj]=null;s.msg=null;return;}
  if(p.t!=='gam'){s.msg={ok:false,text:'Dans les cases du tableau, on place des gamètes (ceux des en-têtes).'};return;}
  if(p.sex!==sx){s.msg={ok:false,text:sx==='f'?'À gauche de la case, on place un gamète de Camille (♀).':'À droite de la case, on place un gamète de Noa (♂).'};shake(a.join(':'));return;}
  c[sx]={c9:p.c9,c1:p.c1};s.cs[ii][jj]=null;s.msg=null;
}
function check3a(){
  var s=S.s3;
  var rf=checkGametes(s.fh,MOTH.g9,MOTH.g1,'Camille','ne possède pas');
  if(!rf.ok){s.msg={ok:false,text:'Gamètes de Camille (à gauche du tableau) : '+rf.text};return;}
  var rm=checkGametes(s.mh,FATH.g9,FATH.g1,'Noa','ne possède pas');
  if(!rm.ok){s.msg={ok:false,text:'Gamètes de Noa (en haut du tableau) : '+rm.text};return;}
  s.hdrDone=true;
  s.msg={ok:true,text:'Chaque parent produit 4 sortes de gamètes. Les gamètes sont maintenant déplaçables : glisse-les dans les cases du tableau.'};
}
var same=function(a,b){return a&&b&&a.c9===b.c9&&a.c1===b.c1;};
function check3b(){
  var s=S.s3, empty=0, ko=0;
  for(var i=0;i<4;i++)for(var j=0;j<4;j++){
    var c=s.cells[i][j];
    if(!c.f||!c.m){s.cs[i][j]=null;empty++;continue;}
    var ok=same(c.f,s.fh[i])&&same(c.m,s.mh[j]);
    s.cs[i][j]=ok?'ok':'ko'; if(!ok)ko++;
  }
  if(!empty&&!ko){s.done=true;s.msg={ok:true,text:'Tableau complet et correct : 4 × 4 = 16 fécondations possibles, donc 16 cellules-œufs différentes. Regarde les caractères des enfants dans chaque case.'};return;}
  var t=[];
  if(ko)t.push(ko+' case(s) en rouge : la case doit contenir le gamète de sa ligne (♀) et celui de sa colonne (♂).');
  if(empty)t.push('Il reste '+empty+' case(s) incomplète(s).');
  s.msg={ok:false,text:t.join(' ')};
}
function ex3(){
  var s=S.s3;
  s.cells[0][0]={f:{c9:s.fh[0].c9,c1:s.fh[0].c1},m:{c9:s.mh[0].c9,c1:s.mh[0].c1}};s.cs[0][0]=null;
  s.msg={ok:true,text:'Exemple : la première case réunit le gamète de la première ligne (♀) et celui de la première colonne (♂). À toi de continuer.'};
}
function clear3(){
  var s=S.s3;
  s.cells=[0,1,2,3].map(function(){return [0,1,2,3].map(function(){return {f:null,m:null};});});
  s.cs=[0,1,2,3].map(function(){return [null,null,null,null];});s.msg=null;
}

/* ---------- étape 4 ---------- */
function counts(){
  var c={},s=S.s3;
  for(var i=0;i<4;i++)for(var j=0;j<4;j++){
    var f=s.fh[i],m=s.mh[j];
    var k=phen9([f.c9,m.c9])+phen1([f.c1,m.c1]);
    c[k]=(c[k]||0)+1;
  }
  return c;
}
function questions(){
  var c=counts(), n=function(k){return c[k]||0;};
  var rneg=n('A-')+n('B-')+n('AB-')+n('O-'), ab=n('AB+')+n('AB-');
  return [
    {id:'q1',type:'choice',text:'Camille (A rh+) et Noa (B rh+) peuvent-ils avoir un enfant de groupe O et de rhésus − ?',
      opts:['Oui, c’est possible','Non, c’est impossible'],ans:n('O-')>0?0:1,
      ok:'Oui, dans '+n('O-')+' case sur 16 : Camille transmet O et −, et Noa aussi. Les parents ne montrent pas les allèles O et − qu’ils portent.'},
    {id:'q2',type:'num',text:'Sur les 16 cases, combien donnent un enfant de rhésus − (quel que soit le groupe) ?',ans:rneg,
      ok:'Il y en a '+rneg+' : l’enfant doit recevoir l’allèle − de Camille et l’allèle − de Noa.'},
    {id:'q3',type:'num',text:'Combien de cases donnent un enfant de groupe AB (quel que soit le rhésus) ?',ans:ab,
      ok:'Il y en a '+ab+' : l’enfant reçoit A de Camille et B de Noa.'},
    {id:'q4',type:'choice',text:'Camille et Noa ont déjà un enfant de groupe A. Leur deuxième enfant sera…',
      opts:['forcément de groupe A, comme le premier','forcément de groupe A ou B','impossible à prévoir : les groupes A, B, AB et O sont tous possibles'],ans:2,
      ok:'La fécondation se fait au hasard : chaque case du tableau a la même chance de se produire.'},
    {id:'q5',type:'choice',text:'Qu’est-ce qui explique que des frères et sœurs, nés des mêmes parents, soient différents ?',
      opts:['Le brassage des chromosomes dans les gamètes, puis le hasard de la fécondation','Les parents changent de chromosomes entre deux naissances','Chaque enfant ne reçoit que les chromosomes de sa mère'],ans:0,
      ok:'Chaque parent fabrique des gamètes différents, et le gamète qui féconde est tiré au hasard.'}
  ];
}
function r4(){
  if(!S.s3.done)return '<div class="card"><p>Termine d’abord l’étape 3.</p></div>';
  var c=counts(), qs=questions(), s=S.s4;
  var order=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
  var bars=order.map(function(k){
    var l=k.replace(/[+-]$/,''), r=k.slice(-1), v=c[k]||0;
    return '<div class="bar"><span>'+l+' rh'+rhs(r)+'</span><div class="track"><div class="fill" style="width:'+(v/4*100)+'%"></div></div><b>'+v+'/16</b></div>';
  }).join('');
  var qh=qs.map(function(q){
    var a=s.a[q.id], body='';
    if(q.type==='choice'){
      body='<div class="opts">'+q.opts.map(function(o,i){
        var cl=a&&a.i===i?(a.ok?' ok':' ko'):'';
        return '<button class="opt'+cl+'" data-act="choice" data-q="'+q.id+'" data-i="'+i+'">'+o+'</button>';
      }).join('')+'</div>';
    }else{
      body='<div class="numrow"><input id="in-'+q.id+'" type="number" min="0" max="16" inputmode="numeric" aria-label="Ta réponse" value="'+(a&&a.v!==undefined?a.v:'')+'"'+(a&&a.ok?' disabled':'')+'>'+
        '<button class="btn" data-act="num" data-q="'+q.id+'"'+(a&&a.ok?' disabled':'')+'>Valider</button></div>';
    }
    var fb=a?(a.ok?'<div class="msg ok">'+q.ok+'</div>':'<div class="msg bad">Ce n’est pas ça. Relis ton tableau et recommence.</div>'):'';
    return '<div class="q"><h3>'+q.text+'</h3>'+body+fb+'</div>';
  }).join('');
  var all=qs.every(function(q){return s.a[q.id]&&s.a[q.id].ok;});
  s.done=all;
  var keep=all?'<div class="card"><h2>Ce que je retiens</h2><ul class="keep">'+
    '<li>Lors de la formation des gamètes, les deux chromosomes de chaque paire se séparent au hasard : chaque parent fabrique des gamètes différents. C’est le brassage génétique.</li>'+
    '<li>Avec deux paires dont les allèles sont différents, un parent produit 2 × 2 = 4 sortes de gamètes.</li>'+
    '<li>La fécondation réunit au hasard un gamète de chaque parent : ici 4 × 4 = 16 combinaisons possibles.</li>'+
    '<li>Des parents qui montrent le même caractère peuvent cacher des allèles différents. Des frères et sœurs sont donc différents.</li></ul></div>':'';
  return '<div class="card"><div class="mission"><b class="t">Ta mission</b><p>Utilise ton tableau pour répondre aux questions. Tu peux corriger tes réponses autant de fois que nécessaire.</p></div>'+
    '<h3>Les 16 enfants possibles, par groupe et rhésus</h3><div class="bars">'+bars+'</div>'+qh+'</div>'+keep;
}

/* ---------- rendu ---------- */
var TITLES=['Ma carte génétique','Mes gamètes','La fécondation','Bilan'];
function avail(n){return n===1||S['s'+(n-1)].done;}
function render(){
  var app=document.getElementById('app');
  var tw=app.querySelector('.tablewrap'), sl=tw?tw.scrollLeft:0;
  var act=document.activeElement, zk=act&&act.dataset?act.dataset.z:null;

    var n=i+1, cl=(S.step===n?' cur':'')+(S['s'+n].done?' done':'');
    return '<button class="stepbtn'+cl+'" data-step="'+n+'"'+(avail(n)?'':' disabled title="Termine d’abord l’étape précédente"')+'><span class="n">'+(S['s'+n].done&&S.step!==n?'✓':n)+'</span>'+t+'</button>';
  }).join('')+'</div>';
  var panel=[r1,r2,r3,r4][S.step-1]();
  app.innerHTML='<div style="display:flex;flex-direction:column;gap:16px">'+steps+panel+'</div>';
  var tw2=app.querySelector('.tablewrap'); if(tw2)tw2.scrollLeft=sl;
  if(zk){var z=app.querySelector('[data-z="'+zk+'"]'); if(z)z.focus({preventScroll:true});}
  var h=document.getElementById('hand');
  if(selK){
    var p=JSON.parse(selK), v=p.t==='chr'?chrSVG(p.al,'sm'):p.t==='gam'?gamHTML(p,'sm'):'<b>'+p.g.slice(0,-1)+' rh'+rhs(p.g.slice(-1))+'</b>';
    h.hidden=false;h.innerHTML='<span>Sélectionné :</span>'+v+'<span>Touche un emplacement pour le placer.</span><button class="btn ghost" data-act="unsel">Annuler</button>';
  }else{h.hidden=true;h.innerHTML='';}
  document.getElementById('foot').innerHTML=
    '<details><summary>Pour l’enseignant</summary><p>Modèle simplifié : le gène du groupe sanguin ABO est sur la paire n°9 et celui du rhésus sur la paire n°1. Les deux gènes sont sur des chromosomes différents, donc le brassage se limite à la répartition indépendante des paires (sans échange entre chromosomes homologues). Les étapes 1 à 3 se réalisent en 30 à 40 minutes. Compétences travaillées : modéliser, utiliser un outil numérique, justifier une réponse à partir d’un tableau.</p></details>'+
    '<div class="btns"><button class="btn ghost" data-act="restart">Recommencer l’activité</button></div>';
}
function shake(id){requestAnimationFrame(function(){var z=document.querySelector('[data-z="'+id+'"]');if(z)z.classList.add('shake');});}
function drop(id,p){
  var a=id.split(':');
  if(a[0]==='s1')d1(a,p);else if(a[0]==='s2')d2(a,p);else d3(a,p);
  render();
  shakeNow(a.join(':'));
}
function shakeNow(){}
function toggleSel(p){selK=(selK===key(p))?null:key(p);render();}

/* ---------- glisser-déposer unifié (souris, doigt, clavier) ---------- */
var drag=null, justDragged=false, hov=null;
function zoneAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.zone'):null;}
function hover(z){if(hov&&hov!==z)hov.classList.remove('over');if(z)z.classList.add('over');hov=z;}
document.addEventListener('pointerdown',function(e){
  if(e.button>0)return;
  var t=e.target.closest&&e.target.closest('.tok'); if(!t)return;
  drag={t:t,p:JSON.parse(t.dataset.p),x:e.clientX,y:e.clientY,moved:false,g:null};
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.moved=true;var g=document.createElement('div');g.className='ghost';g.innerHTML=drag.t.innerHTML;document.body.appendChild(g);drag.g=g;drag.t.classList.add('dragging');
  }
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  hover(zoneAt(e.clientX,e.clientY));
  e.preventDefault();
});
function endDrag(e,cancel){
  if(!drag)return;var d=drag;drag=null;
  if(d.moved){
    d.g.remove();d.t.classList.remove('dragging');hover(null);
    justDragged=true;setTimeout(function(){justDragged=false;},0);
    var z=cancel?null:zoneAt(e.clientX,e.clientY);
    if(z){selK=null;drop(z.dataset.z,d.p);}
  }else if(!cancel){toggleSel(d.p);}
}
document.addEventListener('pointerup',function(e){endDrag(e,false);});
document.addEventListener('pointercancel',function(e){endDrag(e,true);});

document.addEventListener('click',function(e){
  if(justDragged)return;
  var z=e.target.closest('.zone');
  if(z){drop(z.dataset.z,selK?JSON.parse(selK):null);return;}
  var b=e.target.closest('[data-act],[data-step]'); if(!b)return;
  if(b.dataset.step){var n=+b.dataset.step;if(avail(n)){S.step=n;render();window.scrollTo(0,0);}return;}
  var act=b.dataset.act, q=b.dataset.q;
  if(act.indexOf('check')===0||act==='ex3'||act==='clear3')selK=null;
  if(act==='check1')check1();
  else if(act==='check2')check2();
  else if(act==='check3a')check3a();
  else if(act==='check3b')check3b();
  else if(act==='ex3')ex3();
  else if(act==='clear3')clear3();
  else if(act==='unsel')selK=null;
  else if(act==='next'){S.step=Math.min(4,S.step+1);selK=null;render();window.scrollTo(0,0);return;}
  else if(act==='restart'){S=init();selK=null;}
  else if(act==='choice'||act==='num'){
    var qd=questions().filter(function(x){return x.id===q;})[0];
    if(S.s4.a[q]&&S.s4.a[q].ok)return;
    if(act==='choice'){var i=+b.dataset.i;S.s4.a[q]={i:i,ok:i===qd.ans};}
    else{var inp=document.getElementById('in-'+q);if(!inp||inp.value==='')return;var v=+inp.value;S.s4.a[q]={v:v,ok:v===qd.ans};}
  }
  render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&selK){selK=null;render();return;}
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target;
  if(t.matches&&t.matches('input')&&e.key==='Enter'){var qb=document.querySelector('[data-act="num"][data-q="'+t.id.replace('in-','')+'"]');if(qb)qb.click();return;}
  if(t.classList&&t.classList.contains('tok')){e.preventDefault();toggleSel(JSON.parse(t.dataset.p));}
  else if(t.classList&&t.classList.contains('zone')){e.preventDefault();drop(t.dataset.z,selK?JSON.parse(selK):null);}
});
render();
})();
</script>

</body></html>
