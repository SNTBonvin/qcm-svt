<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM — Le rôle des racines</title>
<style>
  :root{
    --soil: #2F2318;
    --soil-light: #4A3A28;
    --paper: #F4EFE2;
    --leaf: #4C7A50;
    --leaf-dark: #365939;
    --clay: #B5652D;
    --sage: #8FA888;
    --ink: #241C13;
    --ok: #3F7D4C;
    --bad: #A6432F;
    --line: rgba(36,28,19,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--soil);
    background-image:
      radial-gradient(ellipse at 20% -10%, rgba(143,168,136,0.18), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(181,101,45,0.15), transparent 55%);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
  }
  .frame{
    width: 100%;
    max-width: 620px;
  }
  .masthead{
    text-align: left;
    margin-bottom: 18px;
    color: var(--paper);
  }
  .kicker{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--sage);
    margin: 0 0 6px 0;
  }
  .masthead h1{
    font-size: clamp(28px, 5vw, 38px);
    margin: 0;
    font-weight: 500;
    line-height: 1.15;
  }
  .card{
    background: var(--paper);
    border-radius: 18px;
    padding: 34px 32px 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
    position: relative;
    overflow: hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; right:0; top:0;
    height: 6px;
    background: linear-gradient(90deg, var(--leaf), var(--sage) 45%, var(--clay));
  }
  .roots{
    display:flex;
    gap: 6px;
    margin-bottom: 24px;
  }
  .root-seg{
    flex:1;
    height: 5px;
    border-radius: 3px;
    background: var(--line);
    position: relative;
    overflow:hidden;
  }
  .root-seg span{
    position:absolute; inset:0;
    background: var(--leaf);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .35s ease;
  }
  .root-seg.filled span{ transform: scaleX(1); }
  .root-seg.current span{ background: var(--clay); transform: scaleX(1); }

  .q-label{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: var(--leaf-dark);
    margin: 0 0 10px 0;
  }
  .prompt{
    font-size: 21px;
    line-height: 1.4;
    margin: 0 0 22px 0;
    font-weight: 500;
  }
  .options{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 6px;
  }
  .option{
    text-align: left;
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 10px;
    padding: 13px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15.5px;
    color: var(--ink);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
    line-height: 1.4;
  }
  .option:hover:not(:disabled){
    border-color: var(--leaf);
    background: #FBFAF4;
  }
  .option:active:not(:disabled){ transform: scale(0.995); }
  .option:disabled{ cursor: default; }
  .option.correct{
    border-color: var(--ok);
    background: rgba(63,125,76,0.10);
  }
  .option.incorrect{
    border-color: var(--bad);
    background: rgba(166,67,47,0.10);
  }
  .option.faded{ opacity: 0.55; }

  .feedback{
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
    display: none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background: rgba(63,125,76,0.12); color: var(--leaf-dark); }
  .feedback.bad{ background: rgba(166,67,47,0.10); color: #7A3222; }
  .feedback strong{ display:block; margin-bottom:4px; font-size:15px; }

  .foot{
    display:flex;
    justify-content: flex-end;
    margin-top: 22px;
  }
  .next-btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    background: var(--leaf-dark);
    color: var(--paper);
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .2s ease, transform .2s ease, background .15s ease;
    pointer-events: none;
  }
  .next-btn.show{ opacity:1; transform:none; pointer-events:auto; }
  .next-btn:hover{ background: var(--soil-light); }

  .result{
    text-align:center;
    display:none;
  }
  .result.show{ display:block; }
  .result-num{
    font-size: 54px;
    font-weight: 600;
    color: var(--leaf-dark);
    line-height:1;
    margin-bottom: 6px;
  }
  .result-sub{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    color: var(--soil-light);
    margin-bottom: 26px;
  }
  .restart-btn{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    background: transparent;
    color: var(--leaf-dark);
    border: 1.5px solid var(--leaf-dark);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
  }
  .restart-btn:hover{ background: rgba(76,122,80,0.08); }

  .recap{
    text-align:left;
    margin: 4px 0 28px 0;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .recap-item{
    display:flex;
    gap: 10px;
    align-items: flex-start;
    padding: 9px 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    border-bottom: 1px solid var(--line);
  }
  .recap-item:last-child{ border-bottom: none; }
  .recap-mark{
    flex: 0 0 20px;
    height: 20px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    margin-top: 1px;
  }
  .recap-mark.ok{ background: var(--ok); }
  .recap-mark.bad{ background: var(--bad); }
  .recap-text{ color: var(--ink); }

  .quiz-body.hidden{ display:none; }

  @media (max-width: 480px){
    .card{ padding: 26px 20px 22px; }
    .prompt{ font-size: 19px; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="masthead">
    <p class="kicker">Atelier racine — SVT</p>
    <h1>Le rôle des racines</h1>
  </div>

  <div class="card">
    <div class="roots" id="roots"></div>

    <div class="quiz-body" id="quizBody">
      <p class="q-label" id="qLabel">Question 1 / 5</p>
      <p class="prompt" id="qPrompt"></p>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="feedback"></div>
      <div class="foot">
        <button class="next-btn" id="nextBtn">Suivant</button>
      </div>
    </div>

    <div class="result" id="result">
      <div class="result-num" id="resultNum"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="recap" id="recap"></div>
      <button class="restart-btn" id="restartBtn">Recommencer</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    prompt: "Comment sont appelées les cellules particulières situées au niveau de l'épiderme de la racine, en forme de tube ?",
    options: [
      "Les poils absorbants",
      "Les vaisseaux conducteurs",
      "Les nodosités",
      "Les mycorhizes"
    ],
    correct: 0,
    explanation: "Les poils absorbants sont des cellules de l'épiderme de la racine en forme de tube, visibles sur l'agrandissement x600."
  },
  {
    prompt: "Dans les expériences de Rosène, pourquoi la plante du tube A ne fane pas alors que celle du tube B fane, alors que les deux tubes contiennent de l'huile, de l'eau et des sels minéraux ?",
    options: [
      "Dans le tube A, la zone pilifère est en contact avec l'eau ; dans le tube B, elle est isolée de l'eau par l'huile",
      "Le tube A contient plus d'eau que le tube B",
      "Le tube B contient plus de sels minéraux que le tube A",
      "La plante du tube B a moins de feuilles au départ"
    ],
    correct: 0,
    explanation: "Dans le tube A, la zone pilifère (riche en poils absorbants) est en contact direct avec l'eau : la plante ne fane pas. Dans le tube B, la zone pilifère est recouverte par l'huile et n'est plus en contact avec l'eau : la plante fane."
  },
  {
    prompt: "Dans les échanges entre la plante et les micro-organismes (bactéries des nodosités ou champignons des mycorhizes), que reçoit la plante ?",
    options: [
      "De la matière organique",
      "Des éléments minéraux (eau + sels minéraux)",
      "De l'oxygène",
      "Du dioxyde de carbone"
    ],
    correct: 1,
    explanation: "La plante donne de la matière organique aux micro-organismes, et en échange, les micro-organismes lui donnent des éléments minéraux (eau + sels minéraux)."
  },
  {
    prompt: "D'après les résultats obtenus après 14 jours de culture, quel est l'effet de la mycorhize sur la croissance de la plante ?",
    options: [
      "La plante pousse moins bien avec mycorhize",
      "La plante pousse mieux (plus grande taille et masse) avec mycorhize",
      "La présence de mycorhize n'a aucun effet sur la croissance",
      "La plante meurt en présence de mycorhize"
    ],
    correct: 1,
    explanation: "Les mesures montrent que les plantules avec mycorhize ont une taille et une masse de tiges/feuilles supérieures à celles sans mycorhize après 14 jours, confirmant l'intérêt de cette association pour la plante."
  },
  {
    prompt: "Quel est le rôle général d'une racine pour une plante ?",
    options: [
      "Produire la matière organique de la plante par photosynthèse",
      "Ancrer la plante dans le sol et y puiser l'eau et les sels minéraux",
      "Produire les fleurs et les fruits",
      "Réaliser les échanges gazeux avec l'air"
    ],
    correct: 1,
    explanation: "Une plante développe des racines dans le sol au fur et à mesure de sa croissance ; les racines lui permettent notamment de puiser l'eau et les sels minéraux dont elle a besoin."
  }
];

let current = 0;
let score = 0;
let answered = false;
let userAnswers = [];

const rootsEl = document.getElementById('roots');
const qLabel = document.getElementById('qLabel');
const qPrompt = document.getElementById('qPrompt');
const qOptions = document.getElementById('qOptions');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizBody = document.getElementById('quizBody');
const resultEl = document.getElementById('result');
const resultNum = document.getElementById('resultNum');
const resultSub = document.getElementById('resultSub');
const restartBtn = document.getElementById('restartBtn');

function buildRoots(){
  rootsEl.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'root-seg';
    seg.innerHTML = '<span></span>';
    rootsEl.appendChild(seg);
  });
}

function updateRoots(){
  const segs = rootsEl.querySelectorAll('.root-seg');
  segs.forEach((seg, i) => {
    seg.classList.remove('filled','current');
    if(i < current) seg.classList.add('filled');
    if(i === current) seg.classList.add('current');
  });
}

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[current];
  qLabel.textContent = `Question ${current+1} / ${QUESTIONS.length}`;
  qPrompt.textContent = q.prompt;
  qOptions.innerHTML = '';
  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.classList.remove('show');
  updateRoots();

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx, btn));
    qOptions.appendChild(btn);
  });
}

function selectAnswer(idx, btnEl){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const allBtns = qOptions.querySelectorAll('.option');
  allBtns.forEach((b, i) => {
    b.disabled = true;
    if(i === q.correct) b.classList.add('correct');
    if(i === idx && idx !== q.correct) b.classList.add('incorrect');
    if(i !== idx && i !== q.correct) b.classList.add('faded');
  });

  const isCorrect = idx === q.correct;
  if(isCorrect) score++;
  userAnswers[current] = isCorrect;

  feedbackEl.className = 'feedback show ' + (isCorrect ? 'ok' : 'bad');
  feedbackEl.innerHTML = `<strong>${isCorrect ? 'Exact !' : 'Pas tout à fait.'}</strong>${q.explanation}`;

  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Voir le résultat' : 'Suivant';
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  current++;
  if(current < QUESTIONS.length){
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizBody.classList.add('hidden');
  resultEl.classList.add('show');
  resultNum.textContent = `${score} / ${QUESTIONS.length} points`;
  let msg = "";
  if(score === QUESTIONS.length) msg = "Toutes les bonnes réponses : le rôle des racines n'a plus de secret pour toi.";
  else if(score >= QUESTIONS.length - 1) msg = "Très bon résultat, presque parfait.";
  else if(score >= QUESTIONS.length / 2) msg = "Un bon début, quelques notions restent à revoir.";
  else msg = "Relis le document sur le rôle des racines et retente ta chance.";
  resultSub.textContent = msg;

  const recapEl = document.getElementById('recap');
  recapEl.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const ok = userAnswers[i];
    const row = document.createElement('div');
    row.className = 'recap-item';
    row.innerHTML = `
      <div class="recap-mark ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✕'}</div>
      <div class="recap-text"><strong>Q${i+1}.</strong> ${q.prompt}</div>
    `;
    recapEl.appendChild(row);
  });

  updateRoots();
}

restartBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  userAnswers = [];
  resultEl.classList.remove('show');
  quizBody.classList.remove('hidden');
  renderQuestion();
});

buildRoots();
renderQuestion();
</script>

</body>
</html>
